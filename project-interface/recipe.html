<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="食譜搜尋結果">
  <title>搜尋結果</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="result-header">
    <div class="container">
      <a href="index.html" class="back-btn" aria-label="返回首頁">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        返回首頁
      </a>
      <h1>搜尋結果：<span id="keywordDisplay"></span></h1>
    </div>
  </header>

  <main class="result-page">
    <div class="container">
      <section id="cardContainer" class="card-grid" aria-label="食譜卡片列表"></section>
      <p id="noResult" class="no-result hidden" aria-live="polite">查無結果</p>
    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
